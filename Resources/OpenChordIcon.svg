<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34204d"/>
      <stop offset="0.52" stop-color="#17142f"/>
      <stop offset="1" stop-color="#071a2c"/>
    </linearGradient>
    <linearGradient id="chord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6eaff"/>
      <stop offset="0.55" stop-color="#d4b8ff"/>
      <stop offset="1" stop-color="#74e7ff"/>
